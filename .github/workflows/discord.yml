name: Discord

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          THREAD_ID: "1532790020396548237"
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK secret is not set"
            exit 1
          fi

          # Strip accidental /github suffix from Discord webhook URLs
          WEBHOOK="${WEBHOOK%/github}"
          WEBHOOK="${WEBHOOK%/}"

          case "$WEBHOOK" in
            *\?*) WEBHOOK_URL="${WEBHOOK}&thread_id=${THREAD_ID}&wait=true" ;;
            *)    WEBHOOK_URL="${WEBHOOK}?thread_id=${THREAD_ID}&wait=true" ;;
          esac

          if [ "$EVENT_NAME" = "release" ]; then
            CONTENT=$(printf '🚀 **Release %s** — %s' "$RELEASE_TAG" "$RELEASE_URL")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CONTENT=$(printf '🔔 teste Discord — `%s` @ `%s`' "$REPO" "${SHA:0:7}")
          else
            SHORT_MSG=$(printf '%s' "${COMMIT_MSG:-}" | head -n1)
            CONTENT=$(printf '📦 **%s** em `%s`: %s\n%s' "$ACTOR" "$REF_NAME" "$SHORT_MSG" "$COMMIT_URL")
          fi

          BODY=$(jq -n --arg content "$CONTENT" '{content: $content}')
          echo "Posting to forum thread ${THREAD_ID}…"
          HTTP_CODE=$(curl -sS -o /tmp/discord-resp.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WEBHOOK_URL" || true)
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/discord-resp.json || true
          echo
          case "$HTTP_CODE" in
            200|204) echo "ok" ;;
            *)
              echo "Discord rejected the webhook"
              exit 1
              ;;
          esac
