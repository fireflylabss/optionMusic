name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPV development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libmpv dev package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rss = curl.exe -fsSL "https://sourceforge.net/projects/mpv-player-windows/rss?path=/libmpv"
          $name = ([regex]::Matches(($rss -join "`n"), 'mpv-dev-x86_64-\d+-git-[0-9a-f]+\.7z') | Select-Object -First 1).Value
          if (-not $name) { throw "no mpv-dev package found in RSS feed" }
          Write-Host "libmpv package: $name"
          curl.exe -fSL -A "Mozilla/5.0" -o mpv-dev.7z "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/$name/download"
          7z x -y -o"$env:RUNNER_TEMP\mpv-dev" mpv-dev.7z
          Get-ChildItem "$env:RUNNER_TEMP\mpv-dev"
          "RUSTFLAGS=-L $env:RUNNER_TEMP\mpv-dev" | Out-File -Append $env:GITHUB_ENV
          "$env:RUNNER_TEMP\mpv-dev" | Out-File -Append $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --all-targets --locked --target x86_64-pc-windows-gnu
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: optionmusic-windows-x86_64
          path: |
            target/x86_64-pc-windows-gnu/release/optionmusic.exe
            target/x86_64-pc-windows-gnu/release/msc.exe
