name: Release CLI

on:
  push:
    tags: ["v*-alpha*", "v*-beta*", "v*-stable"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.3.0-beta.1)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Arch Linux CLI artifact
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      aur_ready: ${{ steps.tag.outputs.aur_ready }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust mpv sqlite pkgconf file
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-((alpha|beta)(\.[1-9][0-9]*)?|stable)$ ]]
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ -f packaging/aur/stillmusic/PKGBUILD && -f packaging/aur/stillmusic-bin/PKGBUILD ]]; then
            echo "aur_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "aur_ready=false" >> "$GITHUB_OUTPUT"
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash scripts/tests/release.test.sh
          cargo test --locked
          cargo build --release --locked --bins
      - name: Package and smoke test
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release-artifact.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: stillmusic-linux-x86_64
          path: target/dist/*
          if-no-files-found: error

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  publish:
    name: Publish GitHub release
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: stillmusic-linux-x86_64
          path: target/dist
      - name: Publish verified assets and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: bash scripts/release-publish.sh "$RELEASE_TAG"

  aur:
    name: Publish AUR packages
    needs: [build, publish]
    if: needs.build.outputs.aur_ready == 'true'
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
