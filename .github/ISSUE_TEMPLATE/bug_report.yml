name: Bug report
description: Something in the player or the downloader misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command, e.g. `msc play ~/Music -s --cava`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        Output of `msc version` and `msc doctor`, plus your distro and `mpv --version`
        (or the libmpv package version).
      render: text
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI (optionmusic / msc)
        - Desktop (src-gpui)
        - Website
    validations:
      required: true
