[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # paste is unmaintained and reaches us through libmpv2; no replacement upstream yet.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licenses stay allowed even when no current dependency uses them.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # webpki-roots ships Mozilla's root store as data under CDLA.
  "CDLA-Permissive-2.0",
  "ISC",
  # libmpv2 / libmpv2-sys bind the LGPL libmpv we already require at runtime.
  "LGPL-2.1",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
