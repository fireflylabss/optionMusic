<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        document.documentElement.className = "js";
        try {
          var t = localStorage.getItem("optionmusic-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
    <meta
      name="description"
      content="optionMusic — minimal local music player. Calm desktop, MPV engine, real CLI. Local music, without the noise — only what matters."
    />
    <meta property="og:title" content="optionMusic — Local music, without the noise" />
    <meta
      property="og:description"
      content="A local player for people who still own music. Desktop when you want to see, terminal when you want to stay."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="optionMusic — a local player for CLI and desktop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="optionMusic — Local music, without the noise" />
    <meta
      name="twitter:description"
      content="A local player for people who still own music. No account, no feed, no recommendations."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="canonical" href="https://music.hory.one/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <title>optionMusic — Local music, without the noise</title>
    <!-- INJECT:JSON_LD -->
  </head>

    <!-- INJECT:NOSCRIPT -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
