    <p class="font-mono ghost" style="font-size:0.85rem;opacity:0.6;">a local player for CLI and desktop</p>
    <h1><em class="accent">optionMusic</em> is a local player for people who still <em class="accent">own music</em>. A calm surface over your files.</h1>
    <p class="lede">No account, no feed, no recommendations. Desktop when you want to <em class="accent">see</em>, terminal when you want to <em class="accent">stay</em>. Same MPV engine underneath.</p>

    <a class="btn" href="https://github.com/fireflylabss/optionMusic">Get the app</a>

    <p class="section-label" style="margin-top:2.5rem;">features</p>
    <ul>
      
      <li>
        <strong>Local playlists + M3U</strong> — your lists are files, yours to keep
      </li>

      <li>
        <strong>MPV engine, cava spectrum</strong> — serious playback, quiet surface
      </li>

      <li>
        <strong>Offline lyrics + ReplayGain</strong> — even volume, no connection needed
      </li>
    </ul>

    <p class="section-label">faq</p>
    
      <section aria-labelledby="where-does-optionmusic-look-for-music-">
        <h3 id="where-does-optionmusic-look-for-music-">Where does optionMusic look for music?</h3>
        <p>Your ~/Music folder by default. Point it anywhere with -m / --music-dir.</p>
      </section>

      <section aria-labelledby="do-i-need-an-account-">
        <h3 id="do-i-need-an-account-">Do I need an account?</h3>
        <p>No. No account, no feed, no recommendations — your files stay yours and playback works offline.</p>
      </section>

      <section aria-labelledby="which-formats-can-it-play-">
        <h3 id="which-formats-can-it-play-">Which formats can it play?</h3>
        <p>Whatever MPV plays — MP3, FLAC, OGG, M4A, Opus and more, powered by libmpv.</p>
      </section>

      <section aria-labelledby="desktop-or-terminal-">
        <h3 id="desktop-or-terminal-">Desktop or terminal?</h3>
        <p>Both, same MPV engine underneath. Desktop when you want to see, terminal (msc) when you want to stay.</p>
      </section>

      <section aria-labelledby="how-do-playlists-work-">
        <h3 id="how-do-playlists-work-">How do playlists work?</h3>
        <p>Local playlists plus M3U — your lists are files, yours to keep.</p>
      </section>
