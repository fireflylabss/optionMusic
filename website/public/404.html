<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem("optionmusic-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta name="robots" content="noindex" />
    <title>404 — Nothing playing here · optionMusic</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f7f4, #14120b);
        --fg: light-dark(#26251e, #edecec);
      }
      :root[data-theme="light"] { color-scheme: light; --bg: #f7f7f4; --fg: #26251e; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #14120b; --fg: #edecec; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100svh; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.011em;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        max-width: calc(1340px + 0.625rem * 4);
        margin-inline: auto;
        padding-inline: calc(0.625rem * 1.5);
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding-block: 4rem 2rem;
      }
      .wrap { width: 100%; max-width: 63ch; }
      h1 { font-size: 2rem; line-height: 1.2; font-weight: 650; margin: 0; text-wrap: balance; }
      h1 em { font-family: Georgia, serif; font-style: italic; font-weight: 500; }
      p.lede { font-size: 1.05rem; line-height: 1.55; opacity: 0.8; max-width: 46ch; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-top: 1.5rem; }
      .btn {
        display: inline-block;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
      }
      .btn:hover { opacity: 0.85; }
      .ghost { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; opacity: 0.6; text-decoration: none; color: inherit; }
      .ghost:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <h1>Nothing <em>playing</em> here.</h1>
        <p class="lede">Just silence on this groove — the page you&rsquo;re looking for is off the record, moved, or never pressed.</p>
        <div class="row">
          <a class="btn" href="/">Back to the music</a>
        </div>
      </div>
    </main>
  </body>
</html>
