# The desktop shell is a member so one lockfile, one target dir and
# `--workspace` lints/tests cover both surfaces. `default-members` keeps bare
# `cargo build`/`cargo test` on the CLI, which needs no GPUI system deps.
[workspace]
members = [".", "src-gpui"]
default-members = ["."]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[package]
name = "optionmusic"
version = "0.2.17"
edition = "2024"
rust-version = "1.85"
description = "optionMusic — minimal black & white CLI music player"
authors = ["AEFireflyLabs"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["music", "audio", "player", "cli", "mp3", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

# Canonical name
[[bin]]
name = "optionmusic"
path = "src/main.rs"

# Short alias (same entrypoint)
[[bin]]
name = "msc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
libmpv2 = "5.0"
anyhow = { workspace = true }
walkdir = "2"
crossterm = "0.28"
optionSDK = "0.1.3"
serde = { workspace = true }
toml = "0.8"
serde_json = { workspace = true }
lofty = "0.24"
base64 = "0.22"
discord-rich-presence = "1.1.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
