[package]
name = "stillmusic"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "still music — minimal black & white CLI music player"
authors = ["AEFireflyLabs"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["music", "audio", "player", "cli", "mp3", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

# Canonical name
[[bin]]
name = "still"
path = "src/main.rs"

# Short alias (same entrypoint)
[[bin]]
name = "msc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
libmpv2 = "6.0"
anyhow = "1"
walkdir = "2"
crossterm = "0.29"
unicode-width = "0.2"
optionSDK = "0.1.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0.150"
lofty = "0.24"
rusqlite = "0.32"
base64 = "0.23"
notify = "8.2.0"
discord-rich-presence = "1.1.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MPRIS lives on the session bus, so it only makes sense where D-Bus does.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.13.2", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
