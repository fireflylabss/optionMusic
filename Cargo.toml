[package]
name = "optionmusic"
version = "0.2.17"
edition = "2024"
rust-version = "1.85"
description = "optionMusic — minimal black & white CLI music player"
authors = ["AEFireflyLabs"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["music", "audio", "player", "cli", "mp3", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

# Canonical name
[[bin]]
name = "optionmusic"
path = "src/main.rs"

# Short alias (same entrypoint)
[[bin]]
name = "msc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
libmpv2 = "5.0"
anyhow = "1"
walkdir = "2"
crossterm = "0.28"
optionSDK = "0.1.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0.150"
lofty = "0.24"
base64 = "0.22"
discord-rich-presence = "1.1.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MPRIS lives on the session bus, so it only makes sense where D-Bus does.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.13.2", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
